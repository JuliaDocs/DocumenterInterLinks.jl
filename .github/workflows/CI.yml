name: CI
on:
  # Feature, `dev`, and `release-*` branches are tested through their pull
  # request. Also running on `push` for these branches would duplicate every
  # job. Use `workflow_dispatch` to test a branch without a pull request.
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  contents: read
jobs:
  test:
    name: Test ${{ matrix.title }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: 'Linux - Latest'
            os: ubuntu-latest
            version: '1'
          - title: 'Windows - Latest'
            os: windows-latest
            version: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3.3.0  # the `v3` tag lags behind the latest release
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - name: Install LocalCoverage
        shell: julia {0}
        run: |
          using Pkg
          Pkg.add(PackageSpec(name="LocalCoverage"))
          Pkg.add(PackageSpec(name="CoverageTools"))
      - name: Show coverage info
        shell: julia {0}
        run: |
          import CoverageTools
          import LocalCoverage
          coverage = CoverageTools.LCOV.readfile("lcov.info")
          report = LocalCoverage.eval_coverage_metrics(coverage, ".")
          show(report)
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: manifest-${{ matrix.os }}
          path: test/Manifest.toml
  testoldest:
    name: Test Lower Compat Bounds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: 1.6
      - uses: julia-actions/cache@v3.3.0  # the `v3` tag lags behind the latest release
      - name: "Instantiate test environment"
        shell: julia --project=test {0}
        run: |
          import Pkg
          println("*** Dev-Installing DocumenterInterLinks")
          Pkg.develop(path=".")
          println("*** Pinning minimal dependencies")
          Pkg.pin([
              Pkg.PackageSpec(name="IOCapture", version="0.2.4"),
              Pkg.PackageSpec(name="CodecZlib", version="0.7.0"),
              Pkg.PackageSpec(name="Documenter", version="1.3.0"),
              Pkg.PackageSpec(name="DocInventories", version="0.3.0"),
              Pkg.PackageSpec(name="MarkdownAST", version="0.1.2"),
          ])
          Pkg.precompile()
          Pkg.status()
      - name: "Run tests"
        shell: julia --color=yes --project=test {0}
        run: |
          include(joinpath(pwd(), "test", "runtests.jl"))
  docs:
    # Builds the documentation. This runs the package, the docs environment, and
    # all their dependencies, so it gets no write access and no secrets.
    # The `docs-deploy` job deploys the result.
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3.3.0  # the `v3` tag lags behind the latest release
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.instantiate()
      - name: Build documentation
        run: julia --color=yes --project=docs docs/make.jl
      - name: Upload documentation
        # For the `docs-deploy` job, and for reviewing pull requests from forks,
        # which get no preview
        uses: actions/upload-artifact@v7
        with:
          name: documenter-interlinks-docs
          path: |
            docs/build
            docs/Manifest.toml
          include-hidden-files: true  # for `.documenter-siteinfo.json`
          if-no-files-found: error
  docs-deploy:
    name: Deploy documentation
    needs: docs
    # Previews are deployed only for pull requests from branches of this
    # repository, not from forks (which cannot get a write token) or from
    # Dependabot (to not give write access to new versions of dependencies
    # before review). The author of a pull request, unlike `github.actor`,
    # cannot be spoofed.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for Documenter to deploy to the `gh-pages` branch
      pull-requests: read  # for Documenter to check the origin of a pull request
      statuses: write  # for Documenter to report the deployment status
    steps:
      # No `julia-actions/cache`: a cache written by the `docs` job must not be
      # restored in a job with write access
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: documenter-interlinks-docs
          path: docs
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Deploy documentation
        run: julia --startup-file=no docs/deploy.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  codestyle:
    name: Codestyle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install JuliaFormatter and format
        # This will use the latest version by default but you can set the version like so:
        #
        # julia  -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter", version="0.13.0"))'
        shell: julia {0}
        run: |
          using Pkg
          Pkg.add(PackageSpec(name="JuliaFormatter"))
          using JuliaFormatter
          format(["src", "docs", "test"], verbose=true)
      - name: Format Check
        shell: julia {0}
        run: |
          out = Cmd(`git diff -U0`) |> read |> String
          if out == ""
              exit(0)
          else
              @error "Some files have not been formatted !!!\n\n$out"
              exit(1)
          end
      - name: Spell Check
        # Pinned: new releases may flag new words. Dependabot updates the version.
        uses: crate-ci/typos@v1.50.2
      - name: Version Check
        shell: julia {0}
        run: |
          using Pkg
          VERSION = VersionNumber(Pkg.TOML.parsefile("Project.toml")["version"])
          BRANCH = ENV["GITHUB_REF_NAME"]
          if ENV["GITHUB_EVENT_NAME"] == "pull_request"
              # For pull_request events, return the head (aka., "from") branch,
              # not the base (aka., "to") branch.
              BRANCH = ENV["GITHUB_HEAD_REF"]
          end
          if startswith(BRANCH, "release-")
              if (length(VERSION.prerelease) == length(VERSION.build))
                  println("Version $VERSION on release branch OK")
              else
                  @error "Invalid version $VERSION on release branch"
                  exit(1)
              end
          elseif (ENV["GITHUB_REF_TYPE"] == "branch") && (BRANCH != "master")
              if ("dev" in VERSION.prerelease) || ("dev" in VERSION.build)
                  println("Version $VERSION OK with dev-suffix on $BRANCH")
              else
                  @error "Invalid version $VERSION on branch $BRANCH: must contain dev suffix"
                  exit(1)
              end
          else
              println("Version $VERSION OK on $BRANCH")
          end
          exit(0)
      - name: Changelog Check
        shell: julia {0}
        run: |
          using Pkg
          using Dates
          VERSION = VersionNumber(Pkg.TOML.parsefile("Project.toml")["version"])
          BRANCH = ENV["GITHUB_REF_NAME"]
          CHANGELOG = read("CHANGELOG.md", String)
          TODAY = string(Dates.today())
          if ("dev" in VERSION.prerelease) || ("dev" in VERSION.build)
              if !contains(CHANGELOG, "## [Unreleased]")
                  @error "CHANGELOG.md for dev-version must contain Unreleased heading"
                  exit(1)
              end
          end
          if startswith(BRANCH, "release-")
              if contains(CHANGELOG, "## [Unreleased]")
                  @error "CHANGELOG.md for releases must not contain Unreleased heading"
                  exit(1)
              end
              release_header =  "## [Version $VERSION][$VERSION] - $TODAY"
              if !contains(CHANGELOG, release_header)
                  @error "CHANGELOG.md must contain release header $(repr(release_header))"
                  exit(1)
              end
              rx_release_link = Regex(replace("[$VERSION]: https://github.com/JuliaDocs/DocumenterInterLinks.jl/releases/tag/v$VERSION", "."=>"\\.", "[" => "\\[", "]" => "\\]"))
              release_link = match(rx_release_link, CHANGELOG)
              if isnothing(release_link)
                  @error "CHANGELOG.md must contain a link for the release $VERSION"
                  exit(1)
              end
              unreleased_link = "[Unreleased]: https://github.com/JuliaDocs/DocumenterInterLinks.jl/compare/v$VERSION...HEAD"
              if !contains(CHANGELOG, unreleased_link)
                  @error "CHANGELOG.md must contain link for future unreleased changes $(repr(unreleased_link)) (but no Unreleased header)"
                  exit(1)
              end
          end
          println("CHANGELOG.md OK")
          exit(0)
