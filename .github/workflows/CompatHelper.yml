name: CompatHelper
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
permissions:
  contents: write  # to push the branch for a pull request
  pull-requests: write  # to open the pull request
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: "Add the General registry via Git"
        shell: julia --color=yes {0}
        run: |
          import Pkg
          ENV["JULIA_PKG_SERVER"] = ""
          Pkg.Registry.add("General")
      - name: "Install CompatHelper"
        shell: julia --color=yes {0}
        run: |
          import Pkg
          name = "CompatHelper"
          uuid = "aa819f21-2bde-4658-8897-bab36330d9b7"
          version = "3"
          Pkg.add(; name, uuid, version)
      - name: "Run CompatHelper"
        shell: julia --color=yes {0}
        run: |
          import CompatHelper
          CompatHelper.main()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The SSH key lets the pull requests from CompatHelper trigger CI,
          # which pull requests created with `GITHUB_TOKEN` cannot
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
